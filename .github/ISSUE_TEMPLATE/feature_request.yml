name: Feature request
description: Suggest a new capability or an improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        AttackGraph is defensive, deterministic and evidence-driven. Exploitation, probing,
        autonomous action on environments and ML/AI-generated risk scores are permanently out
        of scope (see AGENTS.md §2). For changes to architecture or analytical semantics, use
        the *Engineering proposal* template instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What defensive question can't you answer today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This does not require acting on, probing or scanning a real environment.
          required: true
        - label: This does not introduce learned, opaque or AI-generated scoring or findings.
          required: true
