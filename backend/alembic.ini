# Alembic configuration for AttackGraph
#
# Alembic is the CANONICAL schema lifecycle mechanism.
# See backend/app/storage/database.py for the schema authority policy.

[alembic]
script_location = alembic
prepend_sys_path = .

# Database URL is read from the environment variable DATABASE_URL
# in alembic/env.py. Do NOT hardcode credentials here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
